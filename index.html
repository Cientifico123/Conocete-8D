// ANÁLISIS 1: ARRASTRES POR LOTERÍA (24h/48h/72h)
function arrastresLot(df){
    const r={'24h':{},'48h':{},'72h':{}};
    [['24h',7],['48h',14],['72h',21]].forEach(([v,d])=>{
        ['GEORGIA','FLORIDA','NY'].forEach(l=>{
            const dl=df.filter(x=>x.l===l);
            if(dl.length<d)return;
            const un=dl.slice(-d),u7=dl.slice(-7);
            const s23=new Set(un.flatMap(x=>[x.n2,x.n3]));
            const s1=new Set(u7.map(x=>x.n1));
            r[v][l]=[...s23].filter(n=>!s1.has(n)).slice(0,5);
        });
    });
    return r;
}

// ANÁLISIS 2: IMPAS (1ra posición)
function impas(df){
    const r=[];
    for(let n=0;n<100;n++){
        const idx=df.map((d,i)=>d.n1===n?i:-1).filter(i=>i>=0);
        if(idx.length<2)continue;
        const br=[];for(let i=1;i<idx.length;i++)br.push(idx[i]-idx[i-1]);
        r.push({n,ip:Math.round(br.reduce((a,b)=>a+b,0)/br.length*10)/10,ia:df.length-1-idx[idx.length-1],t:idx.length});
    }
    return r.sort((a,b)=>b.ip-a.ip).slice(0,5);
}

// ANÁLISIS 3: TERMINALES
function terminales(df){
    const r=[];
    for(let t=0;t<10;t++){
        const nums=[];for(let n=0;n<100;n++)if(n%10===t)nums.push(n);
        const f1=df.filter(d=>nums.includes(d.n1)).length;
        const f23=df.filter(d=>nums.includes(d.n2)||nums.includes(d.n3)).length;
        let ex=0,tot=0;
        nums.forEach(n=>{df.forEach((d,i)=>{if(d.n2===n||d.n3===n){if(df.slice(i+1,i+22).some(x=>x.n1===n))ex++;tot++}})});
        r.push({t,f1,f23,ta:tot>0?Math.round(ex/tot*1000)/10:0});
    }
    return r.sort((a,b)=>b.ta-a.ta).slice(0,5);
}

// ANÁLISIS 4: ESPECÍFICOS 16-61-04-40
function especificos(df){
    const ult50=new Set(df.slice(-50).map(d=>d.n1));
    return[16,61,4,40].map(n=>{
        const dn=df.filter(d=>d.n1===n);
        if(!dn.length)return{n,act:false,t:0,h:[],m:'NO JUGAR'};
        const hc={};dn.forEach(d=>{const k=d.l+' '+d.h;hc[k]=(hc[k]||0)+1});
        const h=Object.entries(hc).map(([k,c])=>{const[l,hr]=k.split(' ');return{l,h:hr,c}}).sort((a,b)=>b.c-a.c).slice(0,3);
        const act=ult50.has(n);
        return{n,act,t:dn.length,h,m:act&&h.length?'ACTIVO: '+h[0].l+' '+h[0].h:'NO JUGAR'};
    });
}

// ANÁLISIS 5: MONTE CARLO 20,000 (Arrastres + Terminales + Impas + Específicos)
function monteCarlo20k(df){
    const scores={};
    for(let i=0;i<100;i++)scores[i]=0;
    
    // Factor 1: Arrastres (peso alto)
    const arr=arrastresLot(df);
    ['24h','48h','72h'].forEach(v=>{
        ['GEORGIA','FLORIDA','NY'].forEach(l=>{
            (arr[v][l]||[]).forEach(n=>{scores[n]+=3});
        });
    });
    
    // Factor 2: Terminales (peso medio)
    const term=terminales(df);
    term.forEach(t=>{
        for(let n=0;n<100;n++){if(n%10===t.t)scores[n]+=2}
    });
    
    // Factor 3: Impas vencidos (peso alto)
    const imp=impas(df);
    imp.forEach(i=>{if(i.ia>i.ip*0.8)scores[i.n]+=4});
    
    // Factor 4: Específicos activos (peso muy alto)
    const esp=especificos(df);
    esp.forEach(e=>{if(e.act)scores[e.n]+=5});
    
    // Simulación Monte Carlo
    for(let sim=0;sim<20000;sim++){
        const muestra=[];
        for(let i=0;i<100;i++){
            const idx=Math.floor(Math.random()*df.length);
            muestra.push(df[idx]);
        }
        const freq={};
        muestra.forEach(d=>{freq[d.n1]=(freq[d.n1]||0)+1});
        Object.entries(freq).forEach(([n,c])=>{scores[+n]+=c*0.1});
    }
    
    const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
    return sorted.slice(0,2).map(([n,s])=>({n:+n,s:Math.round(s)}));
}

// ANÁLISIS 6: MONTE CARLO 10,000 (Multifactorial: fechas, días, frecuencia)
function monteCarlo10k(df){
    const scores={};
    for(let i=0;i<100;i++)scores[i]={total:0,freq:0,dia:0,fecha:0};
    
    // Factor 1: Frecuencia histórica en 1ra
    const freq1ra={};
    df.forEach(d=>{freq1ra[d.n1]=(freq1ra[d.n1]||0)+1});
    Object.entries(freq1ra).forEach(([n,c])=>{scores[+n].freq=c});
    
    // Factor 2: Día de la semana más frecuente
    const diasFreq={};
    df.forEach(d=>{
        const dia=new Date(d.f).getDay();
        const key=d.n1+'_'+dia;
        diasFreq[key]=(diasFreq[key]||0)+1;
    });
    for(let n=0;n<100;n++){
        let maxDia=0,maxCount=0;
        for(let d=0;d<7;d++){
            const key=n+'_'+d;
            if((diasFreq[key]||0)>maxCount){maxCount=diasFreq[key];maxDia=d}
        }
        scores[n].dia=maxCount;
    }
    
    // Factor 3: Rango de fecha (últimos 30 días pesan más)
    const hoy=new Date();
    df.forEach(d=>{
        const diasDiff=Math.floor((hoy-new Date(d.f))/(1000*60*60*24));
        if(diasDiff<=30)scores[d.n1].fecha+=3;
        else if(diasDiff<=60)scores[d.n1].fecha+=2;
        else scores[d.n1].fecha+=1;
    });
    
    // Simulación Monte Carlo 10,000
    for(let sim=0;sim<10000;sim++){
        const muestra=[];
        for(let i=0;i<50;i++){
            const idx=Math.floor(Math.random()*df.length);
            muestra.push(df[idx]);
        }
        const freq={};
        muestra.forEach(d=>{freq[d.n1]=(freq[d.n1]||0)+1});
        Object.entries(freq).forEach(([n,c])=>{scores[+n].total+=c});
    }
    
    // Score final combinado
    const final={};
    for(let n=0;n<100;n++){
        final[n]=scores[n].freq*2+scores[n].dia*3+scores[n].fecha*4+scores[n].total*0.5;
    }
    
    const sorted=Object.entries(final).sort((a,b)=>b[1]-a[1]);
    return sorted.slice(0,2).map(([n,s])=>({n:+n,s:Math.round(s)}));
}

function verArrastres(){

    ['24h','48h','72h'].forEach((v,vi)=>{
        html+='<div id="a'+(vi+1)+'" class="'+(vi>0?'hidden':'')+'">';
        ['GEORGIA','FLORIDA','NY'].forEach(l=>{
            html+='<div class="lot-title">'+l+'</div>';
            const nums=al[v][l]||[];
            if(nums.length===0)html+='<div class="no-data">Sin arrastres</div>';
            else nums.forEach(n=>{html+='<div class="pred"><div class="pred-num">'+String(n).padStart(2,'0')+'</div><div class="pred-info"><div class="pred-lot">ACTIVO <span class="badge-green">JUGAR</span></div></div></div>'});
        });
        html+='</div>';
    });
    html+='</div>';
    document.getElementById('app').innerHTML=html;
}

function tabArr(el,id){
    el.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
    ['a1','a2','a3'].forEach(x=>{const e=document.getElementById(x);if(e)e.classList.toggle('hidden',x!==id)});
}

function verActualizar(){
    const hoy=new Date().toISOString().split('T')[0];
    let html='<div class="view"><div class="view-header"><div class="view-title">⚙️ ACTUALIZAR</div><button class="btn-back" onclick="menu()">Volver</button></div>';

    html+='<div class="form-group"><label class="form-label">Hora</label><select id="hora" class="form-control"><option>12:30</option><option>13:30</option><option>14:30</option><option>19:00</option><option>21:50</option><option>22:30</option><option>23:30</option></select></div>';

    html+='<button class="btn btn-gold" onclick="guardar()">GUARDAR Y RECALCULAR</button>';
    html+='<button class="btn btn-red" onclick="eliminar()">ELIMINAR ÚLTIMO</button>';
    html+='</div>';
    document.getElementById('app').innerHTML=html;
}

function guardar(){
    const f=document.getElementById('fecha').value;
    const l=document.getElementById('loteria').value;
    const h=document.getElementById('hora').value;
    const n1=parseInt(document.getElementById('n1').value);
    const n2=parseInt(document.getElementById('n2').value);
    const n3=parseInt(document.getElementById('n3').value);
    
    if(!f||isNaN(n1)||isNaN(n2)||isNaN(n3)){alert('Completa todos los campos');return}
    if(n1<0||n1>99||n2<0||n2>99||n3<0||n3>99){alert('Los números deben ser 0-99');return}
    if(n1===n2||n1===n3||n2===n3){alert('No repetir números');return}
    
    LOCALES.push({f:f,l:l,h:h,n1:n1,n2:n2,n3:n3});
    localStorage.setItem('loto_local',JSON.stringify(LOCALES));
    alert('✅ Sorteo guardado. Los análisis se actualizarán.');
    menu();
}

function eliminar(){
    if(LOCALES.length===0){alert('No hay sorteos locales para eliminar');return}
    if(confirm('¿Eliminar el último sorteo guardado?')){
        LOCALES.pop();
        localStorage.setItem('loto_local',JSON.stringify(LOCALES));
        alert('Último sorteo eliminado');
        menu();
    }
}

function verHistorial(){
    const df=getDF(),ult=df.slice(-100).reverse();
    let html='<div class="view"><div class="view-header"><div class="view-title">📜 HISTORIAL</div><button class="btn-back" onclick="menu()">Volver</button></div>';
    html+='<div class="stat-grid"><div class="stat"><div class="stat-value">'+df.length+'</div><div class="stat-label">Total Sorteos</div></div><div class="stat"><div class="stat-value">'+ult.length+'</div><div class="stat-label">Mostrando</div></div></div>';
    html+='<div class="scroll"><table><thead><tr><th>Fecha</th><th>Lot</th><th>Hora</th><th>1ra</th><th>2da</th><th>3ra</th></tr></thead><tbody>';
    ult.forEach(h=>{html+='<tr><td>'+h.f+'</td><td>'+h.l.substring(0,3)+'</td><td>'+h.h+'</td><td><b>'+h.n1+'</b></td><td>'+h.n2+'</td><td>'+h.n3+'</td></tr>'});
    html+='</tbody></table></div></div>';
    document.getElementById('app').innerHTML=html;
}
