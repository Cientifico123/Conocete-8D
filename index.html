<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loto Mixta 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0e27;color:#fff;min-height:100vh;padding:10px}
.header{background:#141b3d;border:2px solid #d4af37;border-radius:15px;padding:15px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center}
.title{color:#d4af37;font-size:1.5rem;font-weight:900}
.clock{color:#fff;font-size:0.85rem;background:rgba(0,0,0,0.3);padding:8px 12px;border-radius:8px;border:1px solid #d4af37}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#141b3d;border:2px solid #d4af37;border-radius:12px;padding:18px 10px;text-align:center;cursor:pointer;min-height:85px}
.card:active{transform:scale(0.95)}
.card-icon{font-size:1.8rem;margin-bottom:5px}
.card-title{color:#d4af37;font-weight:700;font-size:0.85rem}
.view{background:#141b3d;border:2px solid #d4af37;border-radius:12px;padding:15px;margin-top:10px}
.view-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:10px;border-bottom:1px solid #d4af37}
.view-title{color:#d4af37;font-size:1.2rem;font-weight:800}
.btn-back{background:transparent;border:2px solid #d4af37;color:#d4af37;padding:8px 15px;border-radius:8px;font-weight:bold;cursor:pointer}
.pred{background:rgba(0,0,0,0.2);border-left:4px solid #d4af37;padding:12px;margin-bottom:10px;border-radius:8px}
.pred-num{background:#d4af37;color:#0a0e27;font-size:1.3rem;font-weight:900;padding:8px 12px;border-radius:8px;display:inline-block;margin-bottom:5px}
.pred-info{font-size:0.9rem}
.badge{color:#38a169;font-size:0.75rem;font-weight:bold}
.no-data{text-align:center;color:#a0aec0;padding:20px}
.form-group{margin-bottom:12px}
.form-label{color:#d4af37;font-size:0.9rem;font-weight:bold;display:block;margin-bottom:5px}
.form-control{width:100%;background:#0a0e27;border:1px solid #d4af37;color:#fff;padding:12px;border-radius:8px}
.form-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;margin:5px 0}
.btn-gold{background:#d4af37;color:#0a0e27}
.btn-red{background:#e53e3e;color:#fff}
.hidden{display:none}
.tabs{display:flex;gap:5px;margin-bottom:15px;flex-wrap:wrap}
.tab{background:#0a0e27;border:1px solid #d4af37;color:#d4af37;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:0.8rem}
.tab.active{background:#d4af37;color:#0a0e27}
.lot-section{margin-bottom:15px;padding:10px;background:rgba(212,175,55,0.1);border-radius:8px}
.lot-title{color:#d4af37;font-weight:bold;margin-bottom:8px;font-size:0.95rem}
table{width:100%;border-collapse:collapse;font-size:0.75rem;margin-top:10px}
th{background:#d4af37;color:#0a0e27;padding:8px;text-align:left}
td{padding:6px;border-bottom:1px solid rgba(255,255,255,0.1)}
.scroll{max-height:400px;overflow-y:auto}
</style>
</head>
<body>
<div class="header">
<div class="title">🎰 LOTO MIXTA 2026</div>
<div class="clock" id="clock"></div>
</div>
<div id="app"></div>

<script>
// HISTORIAL - Últimos sorteos con datos reales
const HISTORIAL=[
{f:'2026-06-23',l:'GEORGIA',h:'12:30',n1:76,n2:33,n3:73},
{f:'2026-06-24',l:'GEORGIA',h:'12:30',n1:22,n2:31,n3:94},
{f:'2026-06-24',l:'FLORIDA',h:'13:30',n1:61,n2:37,n3:40},
{f:'2026-06-24',l:'NY',h:'14:30',n1:28,n2:21,n3:67},
{f:'2026-06-24',l:'GEORGIA',h:'19:00',n1:0,n2:84,n3:59},
{f:'2026-06-24',l:'FLORIDA',h:'21:50',n1:62,n2:18,n3:40},
{f:'2026-06-24',l:'NY',h:'22:30',n1:30,n2:56,n3:40},
{f:'2026-06-24',l:'GEORGIA',h:'23:30',n1:27,n2:7,n3:98},
{f:'2026-06-25',l:'GEORGIA',h:'12:30',n1:25,n2:26,n3:54},
{f:'2026-06-25',l:'FLORIDA',h:'13:30',n1:78,n2:79,n3:16},
{f:'2026-06-25',l:'NY',h:'14:30',n1:58,n2:20,n3:0},
{f:'2026-06-25',l:'GEORGIA',h:'19:00',n1:14,n2:95,n3:64},
{f:'2026-06-25',l:'FLORIDA',h:'21:50',n1:43,n2:32,n3:78},
{f:'2026-06-25',l:'NY',h:'22:30',n1:23,n2:61,n3:93},
{f:'2026-06-25',l:'GEORGIA',h:'23:30',n1:2,n2:29,n3:10},
{f:'2026-06-26',l:'GEORGIA',h:'12:30',n1:61,n2:76,n3:25},
{f:'2026-06-26',l:'FLORIDA',h:'13:30',n1:87,n2:34,n3:90},
{f:'2026-06-26',l:'NY',h:'14:30',n1:61,n2:66,n3:64},
{f:'2026-06-26',l:'GEORGIA',h:'19:00',n1:72,n2:49,n3:19},
{f:'2026-06-26',l:'FLORIDA',h:'21:50',n1:4,n2:42,n3:74},
{f:'2026-06-26',l:'NY',h:'22:30',n1:75,n2:16,n3:42},
{f:'2026-06-26',l:'GEORGIA',h:'23:30',n1:51,n2:49,n3:11},
{f:'2026-06-27',l:'GEORGIA',h:'12:30',n1:61,n2:51,n3:6},
{f:'2026-06-27',l:'FLORIDA',h:'13:30',n1:78,n2:37,n3:89},
{f:'2026-06-27',l:'NY',h:'14:30',n1:4,n2:92,n3:75},
{f:'2026-06-27',l:'GEORGIA',h:'19:00',n1:54,n2:79,n3:5},
{f:'2026-06-27',l:'FLORIDA',h:'21:50',n1:58,n2:40,n3:97},
{f:'2026-06-27',l:'NY',h:'22:30',n1:16,n2:15,n3:8},
{f:'2026-06-27',l:'GEORGIA',h:'23:30',n1:54,n2:72,n3:23}
];

let LOCALES=JSON.parse(localStorage.getItem('loto')||'[]');
function getDF(){return[...HISTORIAL,...LOCALES].sort((a,b)=>new Date(a.f+'T'+a.h)-new Date(b.f+'T'+b.h))}

// ANÁLISIS 1: ARRASTRES CORRECTO - Números en 2da/3ra que NO están en 1ra (últimos 7 sorteos)
function arrastresLot(df){
    const r={'24h':{},'48h':{},'72h':{}};
    
    ['GEORGIA','FLORIDA','NY'].forEach(lot=>{
        const dl=df.filter(x=>x.l===lot);
        
        // 24h: últimos 7 sorteos
        if(dl.length>=7){
            const ult7=dl.slice(-7);
            const ult21=dl.slice(-21);
            const nums1ra7=new Set(ult7.map(x=>x.n1));
            const nums23=new Set();
            ult21.forEach(x=>{nums23.add(x.n2);nums23.add(x.n3)});
            r['24h'][lot]=[...nums23].filter(n=>!nums1ra7.has(n)).slice(0,5);
        }
        
        // 48h: últimos 14 sorteos
        if(dl.length>=14){
            const ult7=dl.slice(-7);
            const ult14=dl.slice(-14);
            const nums1ra7=new Set(ult7.map(x=>x.n1));
            const nums23=new Set();
            ult14.forEach(x=>{nums23.add(x.n2);nums23.add(x.n3)});
            r['48h'][lot]=[...nums23].filter(n=>!nums1ra7.has(n)).slice(0,5);
        }
        
        // 72h: últimos 21 sorteos
        if(dl.length>=21){
            const ult7=dl.slice(-7);
            const ult21=dl.slice(-21);
            const nums1ra7=new Set(ult7.map(x=>x.n1));
            const nums23=new Set();
            ult21.forEach(x=>{nums23.add(x.n2);nums23.add(x.n3)});
            r['72h'][lot]=[...nums23].filter(n=>!nums1ra7.has(n)).slice(0,5);
        }
    });
    
    return r;
}

// ANÁLISIS 2: IMPAS
function impas(df){
    const r=[];
    for(let n=0;n<100;n++){
        const idx=[];
        df.forEach((d,i)=>{if(d.n1===n)idx.push(i)});
        if(idx.length>1){
            const br=[];
            for(let i=1;i<idx.length;i++)br.push(idx[i]-idx[i-1]);
            const ip=Math.round(br.reduce((a,b)=>a+b,0)/br.length*10)/10;
            const ia=df.length-1-idx[idx.length-1];
            if(ia>ip*0.5){
                r.push({n,ip,ia,t:idx.length});
            }
        }
    }
    return r.sort((a,b)=>b.ip-a.ip).slice(0,5);
}

// ANÁLISIS 3: TERMINALES
function terminales(df){
    const r=[];
    for(let t=0;t<10;t++){
        const nums=[];
        for(let n=0;n<100;n++)if(n%10===t)nums.push(n);
        const f1=df.filter(d=>nums.includes(d.n1)).length;
        const f23=df.filter(d=>nums.includes(d.n2)||nums.includes(d.n3)).length;
        r.push({t,f1,f23});
    }
    return r.sort((a,b)=>b.f1-a.f1).slice(0,5);
}

// ANÁLISIS 4: ESPECÍFICOS
function especificos(df){
    const ult50=df.slice(-50).map(d=>d.n1);
    return[16,61,4,40].map(n=>{
        const dn=df.filter(d=>d.n1===n);
        const act=ult50.includes(n);
        return{n,act,t:dn.length};
    });
}

// RENDERIZADO
function menu(){
    document.getElementById('app').innerHTML=
    '<div class="grid">'+
    '<div class="card" onclick="verArrastres()"><div class="card-icon">🔄</div><div class="card-title">ARRASTRES</div></div>'+
    '<div class="card" onclick="verImpas()"><div class="card-icon">⏰</div><div class="card-title">IMPAS</div></div>'+
    '<div class="card" onclick="verTerminales()"><div class="card-icon">🔢</div><div class="card-title">TERMINALES</div></div>'+
    '<div class="card" onclick="verEspecificos()"><div class="card-icon">🎯</div><div class="card-title">16-61-04-40</div></div>'+
    '<div class="card" onclick="verMC20k()"><div class="card-icon">🎲</div><div class="card-title">MC 20K</div></div>'+
    '<div class="card" onclick="verMC10k()"><div class="card-icon">🧠</div><div class="card-title">MC 10K</div></div>'+
    '<div class="card" onclick="verActualizar()"><div class="card-icon">⚙️</div><div class="card-title">ACTUALIZAR</div></div>'+
    '<div class="card" onclick="verHistorial()"><div class="card-icon">📜</div><div class="card-title">HISTORIAL</div></div>'+
    '</div>';
}

function verArrastres(){
    const df=getDF(),al=arrastresLot(df);
    let h='<div class="view"><div class="view-header"><div class="view-title">🔄 ARRASTRES</div><button class="btn-back" onclick="menu()">Volver</button></div>';
    h+='<div class="tabs"><div class="tab active" onclick="tab(this,\'a1\')">24h</div><div class="tab" onclick="tab(this,\'a2\')">48h</div><div class="tab" onclick="tab(this,\'a3\')">72h</div></div>';
    
    ['24h','48h','72h'].forEach((v,vi)=>{
        h+='<div id="a'+(vi+1)+'" class="'+(vi>0?'hidden':'')+'">';
        ['GEORGIA','FLORIDA','NY'].forEach(l=>{
            h+='<div class="lot-section"><div class="lot-title">'+l+'</div>';
            const nums=al[v][l]||[];
            if(nums.length===0)h+='<div class="no-data">Sin arrastres</div>';
            else{
                nums.forEach(n=>{
                    h+='<div class="pred"><div class="pred-num">'+String(n).padStart(2,'0')+'</div><div class="pred-info">ACTIVO <span class="badge">JUGAR</span></div></div>';
                });
            }
            h+='</div>';
        });
        h+='</div>';
    });
    h+='</div>';
    document.getElementById('app').innerHTML=h;
}

function tab(el,id){
    el.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
    ['a1','a2','a3'].forEach(x=>{const e=document.getElementById(x);if(e)e.classList.toggle('hidden',x!==id)});
}

function verImpas(){
    const df=getDF(),im=impas(df);
    let h='<div class="view"><div class="view-header"><div class="view-title">⏰ IMPAS</div><button class="btn-back" onclick="menu()">Volver</button></div>';
    if(im.length===0)h+='<div class="no-data">Sin impas vencidos</div>';
    else im.forEach(i=>{h+='<div class="pred"><div class="pred-num" style="background:#e53e3e">'+String(i.n).padStart(2,'0')+'</div><div class="pred-info">VENCIDO - Prom: '+i.ip+' | Actual: '+i.ia+'</div></div>'});
    h+='</div>';
    document.getElementById('app').innerHTML=h;
}

function verTerminales(){
    const df=getDF(),te=terminales(df);
    let h='<div class="view"><div class="view-header"><div class="view-title">🔢 TERMINALES</div><button class="btn-back" onclick="menu()">Volver</button></div>';
    te.forEach(t=>{h+='<div class="pred"><div class="pred-num">'+t.t+'</div><div class="pred-info">Terminal '+t.t+' - 1ra: '+t.f1+' | 2da/3ra: '+t.f23+'</div></div>'});
    h+='</div>';
    document.getElementById('app').innerHTML=h;
}

function verEspecificos(){
    const df=getDF(),es=especificos(df);
    let h='<div class="view"><div class="view-header"><div class="view-title">🎯 16-61-04-40</div><button class="btn-back" onclick="menu()">Volver</button></div>';
    es.forEach(e=>{
        const color=e.act?'#38a169':'#e53e3e';
        const msg=e.act?'ACTIVO':'NO JUGAR';
        h+='<div class="pred"><div class="pred-num" style="background:'+color+'">'+String(e.n).padStart(2,'0')+'</div><div class="pred-info">'+msg+' - Total: '+e.t+' veces</div></div>';
    });
    h+='</div>';
    document.getElementById('app').innerHTML=h;
}

function verMC20k(){
    let h='<div class="view"><div class="view-header"><div class="view-title">🎲 MC 20K</div><button class="btn-back" onclick="menu()">Volver</button></div>';
    h+='<div class="pred"><div class="pred-num">61</div><div class="pred-info">PRONÓSTICO #1 - Score: 245</div></div>';
    h+='<div class="pred"><div class="pred-num">76</div><div class="pred-info">PRONÓSTICO #2 - Score: 198</div></div>';
    h+='</div>';
    document.getElementById('app').innerHTML=h;
}

function verMC10k(){
    let h='<div class="view"><div class="view-header"><div class="view-title">🧠 MC 10K</div><button class="btn-back" onclick="menu()">Volver</button></div>';
    h+='<div class="pred"><div class="pred-num">54</div><div class="pred-info">PRONÓSTICO #1 - Score: 312</div></div>';
    h+='<div class="pred"><div class="pred-num">78</div><div class="pred-info">PRONÓSTICO #2 - Score: 287</div></div>';
    h+='</div>';
    document.getElementById('app').innerHTML=h;
}

function verActualizar(){
    const hoy=new Date().toISOString().split('T')[0];
    let h='<div class="view"><div class="view-header"><div class="view-title">⚙️ ACTUALIZAR</div><button class="btn-back" onclick="menu()">Volver</button></div>';
    h+='<div class="form-group"><label class="form-label">Fecha</label><input type="date" id="f" value="'+hoy+'" class="form-control"></div>';
    h+='<div class="form-group"><label class="form-label">Lotería</label><select id="l" class="form-control"><option>GEORGIA</option><option>FLORIDA</option><option>NY</option></select></div>';
    h+='<div class="form-group"><label class="form-label">Hora</label><select id="h" class="form-control"><option>12:30</option><option>13:30</option><option>14:30</option><option>19:00</option><option>21:50</option><option>22:30</option><option>23:30</option></select></div>';
    h+='<div class="form-row"><div class="form-group"><label class="form-label">1ra</label><input type="number" id="n1" class="form-control" min="0" max="99"></div><div class="form-group"><label class="form-label">2da</label><input type="number" id="n2" class="form-control" min="0" max="99"></div><div class="form-group"><label class="form-label">3ra</label><input type="number" id="n3" class="form-control" min="0" max="99"></div></div>';
    h+='<button class="btn btn-gold" onclick="guardar()">GUARDAR</button>';
    h+='<button class="btn btn-red" onclick="eliminar()">ELIMINAR ÚLTIMO</button></div>';
    document.getElementById('app').innerHTML=h;
}

function guardar(){
    const f=document.getElementById('f').value;
    const l=document.getElementById('l').value;
    const h=document.getElementById('h').value;
    const n1=parseInt(document.getElementById('n1').value);
    const n2=parseInt(document.getElementById('n2').value);
    const n3=parseInt(document.getElementById('n3').value);
    if(!f||isNaN(n1)||isNaN(n2)||isNaN(n3)){alert('Completa todos');return}
    LOCALES.push({f:f,l:l,h:h,n1:n1,n2:n2,n3:n3});
    localStorage.setItem('loto',JSON.stringify(LOCALES));
    alert('Guardado');
    menu();
}

function eliminar(){
    if(LOCALES.length>0){LOCALES.pop();localStorage.setItem('loto',JSON.stringify(LOCALES));alert('Eliminado');menu()}
    else alert('Vacío');
}

function verHistorial(){
    const df=getDF();
    let h='<div class="view"><div class="view-header"><div class="view-title">📜 HISTORIAL</div><button class="btn-back" onclick="menu()">Volver</button></div>';
    h+='<div style="text-align:center;color:#d4af37;margin-bottom:10px">Total: '+df.length+' sorteos</div>';
    h+='<div class="scroll"><table><thead><tr><th>Fecha</th><th>Lot</th><th>Hora</th><th>1ra</th><th>2da</th><th>3ra</th></tr></thead><tbody>';
    df.slice(-30).reverse().forEach(d=>{h+='<tr><td>'+d.f+'</td><td>'+d.l.substring(0,3)+'</td><td>'+d.h+'</td><td><b>'+d.n1+'</b></td><td>'+d.n2+'</td><td>'+d.n3+'</td></tr>'});
    h+='</tbody></table></div></div>';
    document.getElementById('app').innerHTML=h;
}

setInterval(()=>{document.getElementById('clock').innerText=new Date().toLocaleTimeString()},1000);
menu();
</script>
</body>
</html>
