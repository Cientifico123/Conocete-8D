var LOCALES=[];

function getDF(){return HISTORIAL.concat(LOCALES);}

function getPrecedentes(numObjetivo){
    var df=getDF();
    var precedentes={};
    for(var i=1;i<df.length;i++){
        if(df[i].n1===numObjetivo){
            var ant=df[i-1].n1;
            precedentes[ant]=(precedentes[ant]||0)+1;
        }
    }
    var resultados=[];
    Object.keys(precedentes).forEach(function(n){
        resultados.push({n:parseInt(n),veces:precedentes[n]});
    });
    resultados.sort(function(a,b){return b.veces-a.veces;});
    return resultados;
}

function getImpasData(){
    var df=getDF();
    var r=[];
    for(var n=0;n<100;n++){
        var idx=[];
        df.forEach(function(d,i){if(d.n1===n)idx.push(i);});
        if(idx.length>=2){
            var br=[];
            for(var i=1;i<idx.length;i++)br.push(idx[i]-idx[i-1]);
            var ipProm=br.reduce(function(a,b){return a+b;},0)/br.length;
            var ipActual=df.length-1-idx[idx.length-1];
            r.push({n:n,ipProm:Math.round(ipProm*10)/10,ipActual:ipActual,fuerza:ipActual/ipProm});
        }
    }
    r.sort(function(a,b){return b.fuerza-a.fuerza;});
    return r;
}

function getArrastresConImpas(){
    var df=getDF();
    var impas=getImpasData();
    var impasMap={};
    impas.forEach(function(i){impasMap[i.n]=i;});
    
    var ult7=[];
    df.forEach(function(d){if(d.l===ultimoSorteo.l)ult7.push(d);});
    ult7=ult7.slice(-7);
    var nums1ra={};
    ult7.forEach(function(d){nums1ra[d.n1]=true;});
    
    var nums23={};
    df.forEach(function(d){
        if(!nums1ra[d.n2])nums23[d.n2]=(nums23[d.n2]||0)+1;
        if(!nums1ra[d.n3])nums23[d.n3]=(nums23[d.n3]||0)+1;
    });
    
    var resultados=[];
    Object.keys(nums23).forEach(function(n){
        var num=parseInt(n);
        var porHorario={};
        var porLoteria={};
        df.forEach(function(d){
            if(d.n1===num && !(d.l===ultimoSorteo.l && d.h===ultimoSorteo.h)){
                porHorario[d.h]=(porHorario[d.h]||0)+1;
                porLoteria[d.l]=(porLoteria[d.l]||0)+1;
            }
        });
        var mejorH='',maxH=0;
        var mejorL='',maxL=0;
        Object.keys(porHorario).forEach(function(h){if(porHorario[h]>maxH){maxH=porHorario[h];mejorH=h;}});
        Object.keys(porLoteria).forEach(function(l){if(porLoteria[l]>maxL){maxL=porLoteria[l];mejorL=l;}});
        
        var impa=impasMap[num]||null;
        var scoreImpa=impa&&impa.fuerza>=0.8?2:0;
        
        if(maxH>0 && !(mejorL===ultimoSorteo.l && mejorH===ultimoSorteo.h)){
            resultados.push({
                n:num,
                veces:nums23[n],
                horario:mejorH,
                loteria:mejorL,
                freq:maxL,
                impaFuerza:impa?Math.round(impa.fuerza*100)/100:0,
                scoreTotal:nums23[n]+scoreImpa
            });
        }
    });
    resultados.sort(function(a,b){return b.scoreTotal-a.scoreTotal;});
    return resultados;
}

function getJugarHoy(){
    var df=getDF();
    var scores={};
    for(var i=0;i<100;i++)scores[i]={score:0,horarios:{},loterias:{},freq:0,recencia:0,arrastre:0,impa:0};
    
    var hoy=new Date();
    
    df.forEach(function(d){
        if(!(d.l===ultimoSorteo.l && d.h===ultimoSorteo.h)){
            scores[d.n1].freq++;
            scores[d.n1].horarios[d.h]=(scores[d.n1].horarios[d.h]||0)+1;
            scores[d.n1].loterias[d.l]=(scores[d.n1].loterias[d.l]||0)+1;
            var diasDiff=Math.floor((hoy-new Date(d.f))/(1000*60*60*24));
            if(diasDiff<=7)scores[d.n1].recencia+=3;
            else if(diasDiff<=30)scores[d.n1].recencia+=2;
            else scores[d.n1].recencia+=1;
        }
    });
    
    var arrastres=getArrastresConImpas();
    arrastres.forEach(function(a){
        if(scores[a.n])scores[a.n].arrastre+=3;
    });
    
    var impas=getImpasData();
    impas.forEach(function(i){
        if(i.fuerza>=0.8 && scores[i.n])scores[i.n].impa+=4;
    });
    
    [16,61,40].forEach(function(n){if(scores[n])scores[n].score+=2;});
    
    var resultados=[];
    Object.keys(scores).forEach(function(n){
        var s=scores[n];
        var mejorH='',maxH=0;
        var mejorL='',maxL=0;
        Object.keys(s.horarios).forEach(function(h){if(s.horarios[h]>maxH){maxH=s.horarios[h];mejorH=h;}});
        Object.keys(s.loterias).forEach(function(l){if(s.loterias[l]>maxL){maxL=s.loterias[l];mejorL=l;}});
        
        var totalScore=s.freq*2+s.recencia+s.arrastre+s.impa;
        if(totalScore>0 && !(mejorL===ultimoSorteo.l && mejorH===ultimoSorteo.h)){
            resultados.push({n:parseInt(n),score:totalScore,horario:mejorH,loteria:mejorL,freq:s.freq});
        }
    });
    resultados.sort(function(a,b){return b.score-a.score;});
    return resultados.slice(0,3);
}

function verTerminales(){
    var df=getDF();
    var r=[];
    for(var t=0;t<10;t++){
        var nums=[];
        for(var n=0;n<100;n++)if(n%10===t)nums.push(n);
        var porHorario={};
        var porLoteria={};
        var total=0;
        df.forEach(function(d){
            if(nums.indexOf(d.n1)>=0 && !(d.l===ultimoSorteo.l && d.h===ultimoSorteo.h)){
                total++;
                porHorario[d.h]=(porHorario[d.h]||0)+1;
                porLoteria[d.l]=(porLoteria[d.l]||0)+1;
            }
        });
        var mejorH='',maxH=0;
        var mejorL='',maxL=0;
        Object.keys(porHorario).forEach(function(h){if(porHorario[h]>maxH){maxH=porHorario[h];mejorH=h;}});
        Object.keys(porLoteria).forEach(function(l){if(porLoteria[l]>maxL){maxL=porLoteria[l];mejorL=l;}});
        if(mejorH && !(mejorL===ultimoSorteo.l && mejorH===ultimoSorteo.h)){
            r.push({t:t,total:total,horario:mejorH,loteria:mejorL,freq:maxL});
        }
    }
    r.sort(function(a,b){return b.total-a.total;});
    var html='<div class="view">';
    html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">';
    html+='<h2>🔢 TERMINALES</h2>';
    html+='<button class="btn" style="width:auto;padding:8px 15px" onclick="menu()">VOLVER</button>';
    html+='</div>';
    r.slice(0,3).forEach(function(t,i){
        html+='<div class="section">';
        html+='<div class="section-title">#'+(i+1)+' Terminal '+t.t+'</div>';
        html+='<div class="jugar">✅ '+t.loteria+' '+t.horario+'</div>';
        html+='<div style="font-size:0.85rem;color:#a0aec0;margin-top:5px">Total: '+t.total+' veces</div>';
        html+='</div>';
    });
    html+='</div>';
    document.getElementById('app').innerHTML=html;
}

function verMC20k(){
    var df=getDF();

        if(!(d.l===ultimoSorteo.l && d.h===ultimoSorteo.h)){
            scores[d.n1].score+=3;
            scores[d.n1].horarios[d.h]=(scores[d.n1].horarios[d.h]||0)+1;
            scores[d.n1].loterias[d.l]=(scores[d.n1].loterias[d.l]||0)+1;
        }

        var idx=Math.floor(Math.random()*df.length);

function verMC10k(){

        if(!scores[a.n])scores[a.n]={score:0,horarios:{},loterias:{}};

function borrarUltimo(){
    if(LOCALES.length===0){alert('No hay sorteos locales para borrar');return;}
    if(confirm('¿Borrar el último sorteo guardado?')){
        LOCALES.pop();
        if(HISTORIAL.length>0){
            var ult=HISTORIAL[HISTORIAL.length-1];
            ultimoSorteo={l:ult.l,h:ult.h,f:ult.f};
        }
        alert('✅ Último sorteo borrado\n📊 Total: '+getDF().length+' sorteos');
        menu();
    }
}

function guardar(){
    var f=document.getElementById('f').value;
    var l=document.getElementById('l').value;
    var h=document.getElementById('h').value;
    var n1=parseInt(document.getElementById('n1').value);
    var n2=parseInt(document.getElementById('n2').value);
    var n3=parseInt(document.getElementById('n3').value);
    if(!f||isNaN(n1)){alert('Completa todos');return;}
    if(n1<0||n1>99||n2<0||n2>99||n3<0||n3>99){alert('Números 0-99');return;}
    if(n1===n2||n1===n3||n2===n3){alert('No repetir');return;}
    
    LOCALES.push({f:f,l:l,h:h,n1:n1,n2:n2,n3:n3});
    ultimoSorteo={l:l,h:h,f:f};
    
    alert('✅ Guardado\n Total: '+getDF().length+' sorteos\n🔄 Ventanas recalculadas');
    menu();
}
