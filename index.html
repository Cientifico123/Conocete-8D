function GT(){const r=[0,1,2,3].map(i=>R(0,i));let s=0,c=0,m=0,f=0;if(r[0]===0){s++;c++}if(r[0]===1||r[0]===3){f++}if(r[0]===2){m++}if(r[1]===0){s++}if(r[1]===1){m++;c++}if(r[1]===2){m++}if(r[1]===3){f++}if(r[2]===0){s++;c++}if(r[2]===1){m++;f++}if(r[2]===2){m++}if(r[2]===3){f++}if(r[3]===0){s++;c++}if(r[3]===1){c++;m++}if(r[3]===2){m++}if(r[3]===3){f++}const mx=Math.max(s,c,m,f);if(mx<3)return{tipo:'Temperamento mixto 🔀',desc:'Tu perfil combina rasgos de varios temperamentos según el contexto. Eso habla de flexibilidad y adaptación, aunque también puede significar que aún estás descubriendo cuál es tu base natural.'};if(s===mx&&s>c&&s>m&&s>f)return{tipo:'Sanguíneo 😄',desc:'Eres extrovertido/a, entusiasta y buscas novedad y conexión social. Tu energía es contagiosa. El reto puede ser la constancia cuando la novedad pasa.'};if(c===mx&&c>s&&c>m&&c>f)return{tipo:'Colérico 😤',desc:'Eres directo/a, decidido/a y orientado/a a resultados. Tienes una energía que empuja a actuar. Tu reto suele ser la paciencia con los procesos lentos.'};if(m===mx&&m>s&&m>c&&m>f)return{tipo:'Melancólico 🌧️',desc:'Eres profundo/a, analítico/a y muy sensible a los detalles y emociones. Percibes cosas que otros no ven. Tu reto puede ser no quedarte en el análisis o la autocrítica.'};return{tipo:'Flemático 😌',desc:'Eres calmado/a, paciente y buscas armonía y estabilidad. Eres un ancla para quienes te rodean. Tu reto puede ser expresar más lo que necesitas.'}}

conocimiento sólido. Puedes verte con honestidad, gestionar lo que sientes y actuar desde un lugar más consciente. Eso no significa que todo esté resuelto — significa que tienes la base para seguir creciendo.`;pt=[{icon:'✨',txt:'Quien se conoce bien tiene menos sorpresas desagradables — y más libertad de elegir.'},{icon:'🧭',txt:nm.length?`Aún hay zonas por explorar: ${nm.join(' y ')}.`:'Sigue cultivando lo que ya funciona — el equilibrio hay que mantenerlo.'},{icon:'💬',txt:'Tu nivel de integración es un regalo para quienes te rodean también.'}];ct='El autoconocimiento no es un destino. Es una práctica. Sigue eligiéndola.'}else{st='Perfil equilibrado en construcción';tx=`Tienes una mezcla interesante: áreas donde ya hay solidez y otras donde aún hay margen. Ese equilibrio imperfecto es exactamente lo que te hace humano/a — y también lo que te da tanto por descubrir.`;pt=[{icon:'🌗',txt:'No necesitas estar "completo/a" para avanzar. Solo necesitas seguir mirando.'},{icon:'🔑',txt:na.length?`Lo que ya funciona en ti — ${na.slice(0,2).join(' y ')} — es tu punto de apoyo.`:'Cada dimensión que entiendes mejor es una puerta que se abre.'},{icon:'🌀',txt:'El autoconocimiento no se termina. Cada etapa de vida te devuelve un reflejo nuevo.'}];ct='Conocerte mejor no te hace más complicado/a — te hace más libre.'}const it={bajo:'Tu nivel de coherencia interna aún está desarrollándose — hay distancia entre quién eres y cómo te muestras. Eso es el punto de partida más honesto que existe.',medio:'Hay momentos de coherencia real y otros donde el piloto automático toma el control. Reconocerlo ya es un paso enorme.',alto:'Tus respuestas en la dimensión de integración muestran que vives desde un lugar relativamente consciente y coherente. Eso se nota en todo lo demás.'};return{subtipo:st,texto:tx,puntos:pt,cta:ct,integText:it[n8],temp:t}}

function RQ(){const dm=D[E.pasoActual];const tl=D.length;const pc=Math.round((E.pasoActual/tl)*100);const cp=DC(E.pasoActual);const ph=dm.preguntas.map((pr,ix)=>{const rs=R(E.pasoActual,ix);const op=dm.opciones[ix].map((tx,vl)=>{const sl=rs===vl?'s':'';return`<div class="op2 ${sl}" data-d="${E.pasoActual}" data-p="${ix}" data-v="${vl}">${tx}</div>`}).join('');return`<div class="pr ${rs!==null?'r':''}" id="pr-${ix}"><div class="pnu">Pregunta ${ix+1} de ${dm.preguntas.length}</div><div class="ptx">${pr}</div><div class="op">${op}</div></div>`}).join('');return`<div class="p a"><div class="ph"><div class="pi2"><span class="pl">${dm.emoji} ${dm.nombre}</span><span class="pco">${E.pasoActual+1} / ${tl}</span></div><div class="pt2"><div class="pf2" style="width:${pc}%"></div></div></div><div class="dh"><div class="dn">Dimensión ${E.pasoActual+1}</div><div class="dnm">${dm.nombre}</div><div class="dd">💡 ${dm.descripcion}</div></div>${ph}<div class="nb"><button class="bab" id="b4" ${E.pasoActual===0?'disabled':''}>← Atrás</button><button class="ban" id="b5" ${!cp?'disabled':''}>${E.pasoActual===tl-1?'Ver mi perfil →':'Siguiente →'}</button></div></div>`}
function RMR(){const t=GT();const C=[{emoji:'🌡️',nombre:'Temperamento',concepto:'Tu temperamento es el sistema operativo con el que llegaste al mundo. No lo elegiste, pero opera en ti todo el tiempo: define cómo reaccionas ante lo inesperado, cómo tomas decisiones bajo presión y cómo te relacionas con los demás. Conocerlo te da el mapa para usarlo a tu favor.',remates:{Sanguíneo:'Tu energía y entusiasmo son motores poderosos. El reto es que cuando la novedad baja, también puede bajar tu compromiso. Conocer eso te da ventaja.',Colérico:'Eres el tipo de persona que hace que las cosas pasen. Tu riesgo está en la impaciencia. Cuando lo sabes, puedes elegir cuándo frenar.',Melancólico:'Percibes lo que otros ignoran. Tu profundidad es un don real. El peligro está en que ese mismo análisis puede volverse parálisis si no lo gestionas.',Flemático:'Eres el ancla que muchos necesitan. Tu calma es valiosa. El riesgo es que lo que no expresas a tiempo puede costarte oportunidades y relaciones.','Temperamento mixto':'Tu flexibilidad es genuina. Según el contexto, puedes activar distintas respuestas. El desafío está en aprender cuál activar de forma consciente, no por impulso.'}},{emoji:'🧱',nombre:'Tolerancia a la frustración',concepto:'La tolerancia a la frustración no es paciencia. Es la capacidad de seguir funcionando cuando las cosas no salen como esperabas. Es lo que separa a quien abandona en el intento tres de quien llega al intento treinta. No es un rasgo fijo: es un músculo. Pero si no sabes cómo está ese músculo hoy, no puedes entrenarlo.',remates:{alto:'Tu tolerancia es real. Eso significa que los obstáculos no te definen — tú los defines a ellos. Sigue cultivándola: es una de las ventajas más escasas.',medio:'Tienes recursos, pero no siempre los activas. La diferencia entre tu techo actual y el siguiente nivel está en cuánto confías en ti cuando la situación se pone difícil.',bajo:'Los obstáculos te pesan más de lo que te gustaría. Eso no es un defecto de carácter — es la señal de que este músculo tiene mucho margen de crecimiento. Y el margen es oportunidad.'}},{emoji:'⚔️',nombre:'Gestión de conflictos',concepto:'El conflicto no es el problema. La forma en que lo manejamos sí puede serlo. Hay quien explota y destruye lo que ha construido. Hay quien evita hasta que el silencio se convierte en distancia. Y hay quien enfrenta con claridad y sale del otro lado con la relación más fuerte. Tu estilo de conflicto se formó antes de que pudieras elegirlo. Pero hoy, si lo conoces, puedes decidir si quieres seguir usándolo o cambiarlo.',remates:{alto:'Puedes enfrentar los desacuerdos sin destruir lo que hay alrededor. Eso es madurez relacional real — y es más escasa de lo que parece.',medio:'A veces navegas bien el conflicto, otras el viejo patrón toma el control. Estás en el punto exacto donde la consciencia puede hacer la diferencia.',bajo:'El conflicto te cuesta — ya sea porque explotas o porque tragas. Ambos extremos tienen un precio. Saberlo ya es el primer paso para cambiar el patrón.'}},{emoji:'🙈',nombre:'No ver el mal',concepto:'Todos tenemos zonas ciegas: realidades que están ahí pero que preferimos no mirar. A veces es una relación que no funciona. A veces es un patrón propio que se repite. A veces es algo en nuestra vida que claramente pide un cambio. No verlo no lo hace desaparecer — solo lo deja operar sin control. La diferencia entre quien crece y quien se estanca no siempre es la inteligencia ni el talento: muchas veces es simplemente la disposición a mirar lo que duele.',remates:{alto:'Tienes la valentía de mirar donde muchos prefieren no hacerlo. Eso es lo que permite el cambio real, no solo el deseo de cambiar.',medio:'Hay cosas que ves y cosas que prefieres no mirar todavía. Reconocer dónde está esa línea ya es una forma de honestidad.',bajo:'Hay zonas de tu vida o de ti mismo/a que aún no estás listo/a para mirar. No hay juicio en eso — pero sí hay un costo. Y ya lo sabes.'}},{emoji:'🙉',nombre:'No oír el mal',concepto:'Escuchar no es dejar que los sonidos lleguen a tus oídos. Es dejar que lo que el otro dice te llegue de verdad, antes de que tu mente active la defensa. Una crítica que no puedes recibir es información que pierdes. Una emoción ajena que no puedes sostener es una conexión que no puede ocurrir. Filtramos lo que oímos por miedo: miedo a cambiar, miedo a que tengan razón, miedo a que lo que escuchamos nos obligue a hacer algo. Saber cómo filtras te da el poder de elegir cuándo abrir el filtro.',remates:{alto:'Puedes recibir lo que te llega con apertura real. Eso te da acceso a información — sobre ti, sobre otros — que la mayoría pierde.',medio:'A veces escuchas de verdad y otras activas el filtro. El trabajo está en hacerlo más consciente: que sea una elección, no un reflejo.',bajo:'Lo que no puedes escuchar sigue afectándote igual — solo que sin que puedas procesarlo. Abrir ese canal, aunque sea un poco, cambia lo que eres capaz de recibir.'}},{emoji:'🙊',nombre:'No hablar el mal',concepto:'Lo que no dices no desaparece. Se acumula. Se convierte en distancia, en resentimiento, en una versión de ti que actúa desde lo que calla y no desde lo que elige. Callar lo que sientes puede parecer protección — hacia el otro o hacia ti. Pero a largo plazo, el silencio tiene un precio más alto que la incomodidad de decirlo. Quien aprende a expresar lo que necesita con claridad y sin drama construye relaciones reales. Y sobre todo, se construye a sí mismo/a.',remates:{alto:'Puedes decir lo que necesitas y lo que sientes, incluso cuando es difícil. Eso no es poca cosa — es la base de las relaciones que valen la pena.',medio:'Hay momentos en que te expresas bien y otros en que el silencio gana. Seguir empujando esa frontera es parte del trabajo.',bajo:'Llevas cosas que no has dicho. Eso tiene un peso. No tienes que decirlo todo de golpe — pero sí vale la pena preguntarte qué te cuesta más callar y por qué.'}},{emoji:'🔥',nombre:'Sexualidad',concepto:'La sexualidad es una de las dimensiones más silenciadas y más influyentes al mismo tiempo. No es solo lo que ocurre en la intimidad física — es cómo te relacionas con tu cuerpo, con el deseo, con la comunicación en ese espacio. Una persona que no puede expresar lo que quiere en la intimidad, tampoco suele poder pedirlo en otras áreas de su vida. Y una persona que lleva vergüenza o insatisfacción en este plano lo carga en todo lo demás. Conocer esta dimensión no es un lujo — es parte de conocerte entero/a.',remates:{alto:'Tienes una relación relativamente cómoda y honesta con tu mundo íntimo. Esa comodidad se traduce en libertad — y en conexiones más reales.',medio:'Hay aspectos de tu intimidad que funcionan y otros que todavía sientes limitados. Eso no es un problema — es un proceso activo.',bajo:'Hay incomodidad o insatisfacción en este plano. No hay nada roto en ti — hay espacio para sanar y para conocerte más profundo/a en una dimensión que importa.'}},{emoji:'✨',nombre:'Personalidad integrada',concepto:'La integración personal es el punto al que llegan todas las dimensiones anteriores. Es el nivel en que ya no reaccionas solo desde el temperamento, el miedo o el piloto automático — sino desde quien realmente eres cuando te conoces. No significa ser perfecto/a. Significa que hay coherencia entre lo que piensas, lo que sientes y lo que haces. Quien vive integrado/a no tiene menos conflictos ni menos obstáculos. Solo los enfrenta desde un lugar más honesto y más libre.',remates:{alto:'Tus respuestas muestran coherencia real entre quién eres y cómo actúas. Eso es lo que hace que el autoconocimiento se convierta en algo más que teoría.',medio:'Hay momentos de coherencia genuina y otros donde el piloto automático toma el control. Eso es lo más humano que existe — y el punto exacto desde donde se puede crecer.',bajo:'Todavía hay distancia entre quién eres y cómo te muestras. Ese gap no es una falla — es el mapa. Y tener el mapa ya es más de lo que tiene la mayoría.'}}];function TH(d,n,tt){let rm='';if(d.nombre==='Temperamento'){const tk=Object.keys(d.remates).find(k=>tt&&tt.includes(k.split(' ')[0]));rm=d.remates[tk]||d.remates['Temperamento mixto']}else{rm=d.remates[n]||''}const bc=n==='alto'?'mba':n==='medio'?'mbm':'mbb';const bl=n==='alto'?'Alto':n==='medio'?'Medio':'Bajo';const bh=d.nombre!=='Temperamento'?`<span class="mrb ${bc}">${bl}</span>`:`<span class="mrb mbm">${tt}</span>`;return`<div class="mrc"><div class="mrh"><div class="mrn">${d.emoji} ${d.nombre}</div>${bh}</div><div class="mrc2">${d.concepto}</div><div class="mrr"><strong>En tu caso:</strong> ${rm}</div></div>`}const tt=t.tipo;const c0=TH(C[0],null,tt);const cs=[1,2,3,4,5,6,7].map(i=>{const p=GP(i);const n=GN(p);return TH(C[i],n,null)}).join('');return`<div class="mw2"><div class="mrt">📖 Lo que cada dimensión revela</div><div class="mrs">Tu fotografía en 8 dimensiones</div>${c0}${cs}</div>`}
function RPF(){const t=GT();const i=GPI();const bh=D.slice(0,7).map((dm,ix)=>{const p=GP(ix);const pc=GPct(p);const n=GN(p);const l=n==='alto'?'Alto':n==='medio'?'Medio':'Bajo';return`<div class="bd"><div class="bl"><span class="bna">${dm.emoji} ${dm.nombre}</span><span class="bni n${n==='alto'?'a':n==='medio'?'m':'b2'}">${l}</span></div><div class="bt"><div class="bfi f${n==='alto'?'a':n==='medio'?'m':'b'}" style="--w:${pc}%;--delay:${ix*0.08}s"></div></div></div>`}).join('');function SH(em,no,tp,re,mo,rf){return`<div class="ps2"><div class="sh"><div class="se">${em}</div><div class="sm"><div class="sn">${no}</div><div class="st">${tp}</div></div></div><div class="sr">${re}</div><div class="sm2"><strong>Moraleja:</strong> ${mo}</div><div class="sr2"><strong>🔎 Para ti:</strong> ${rf}</div></div>`}const s0=SH('🌡️','Temperamento',t.tipo,t.desc,'Tu temperamento no es una cárcel. Es tu punto de partida. Conocerlo te da libertad para elegir cómo expresarlo.','¿En qué momentos este temperamento te ayuda y en cuáles genera fricción? Ahí está la clave.');function SG(d){const dm=D[d];const p=GP(d);const n=GN(p);const pf=PD[d];const ix=n==='bajo'?0:n==='medio'?1:2;const m=['La frustración no mide tu valor, mide tu entrenamiento. Cada vez que no abandonas, te haces más fuerte.','Los conflictos no destruyen relaciones; la forma en que los manejamos sí lo hace, o las fortalece.','Lo que no miras sigue ahí. Pero lo que sí miras, aunque duela, te devuelve poder.','Escuchar de verdad no significa estar de acuerdo. Significa dejar que lo que el otro dice te llegue antes de reaccionar.','Callar lo que necesitas no es proteger al otro. A veces es protegerte tú de la incomodidad de decirlo.','Tu sexualidad no existe para cumplir expectativas ajenas. Existe para conectarte contigo y con quien elijas.'];const r=['¿Qué tipo de obstáculos te cuestan más? ¿Qué necesitarías para sostenerte un poco más ante ellos?','¿Qué estilo de conflicto usas más? ¿Está funcionando o te está costando relaciones?','¿Hay algo que sabes que existe en tu vida pero prefieres no mirar? ¿Qué temes que pasaría si lo vieras?','¿Hay algo que alguien te ha dicho muchas veces y siempre no has podido realmente escuchar?','¿Hay algo que llevas tiempo sin decir? ¿Qué te lo impide realmente?','¿Hay algo en tu mundo íntimo que quisieras que fuera diferente? ¿Qué necesitarías para empezar a cambiarlo?'];return SH(dm.emoji,dm.nombre,pf.nombre[ix],pf[n],m[d-1],r[d-1])}const pi=i;const ih=`<div class="pi4"><div class="pit">✨ PERSONALIDAD INTEGRADA — TU PERFIL COMPLETO</div><div class="pis">${pi.subtipo}</div><div class="pit2">${pi.texto}</div><div class="pit2" style="font-style:italic;color:var(--muted);font-size:1rem;">${pi.integText}</div><div class="pip">${pi.puntos.map(p=>`<div class="pii"><span class="pip2">${p.icon}</span><span>${p.txt}</span></div>`).join('')}</div><div class="pcb">${pi.cta}</div></div>`;return`<div class="p a"><div class="ph2"><span class="pi3">✨</span><h2 class="pt3">Tu perfil <span>8D</span></h2><p class="ps">Resultado basado exactamente en lo que tú marcaste. No hay respuestas correctas ni incorrectas.</p></div><div class="rv"><div class="rt">📊 Resumen — 7 dimensiones</div>${bh}</div>${RMR()}${ih}${s0}${[1,2,3,4,5,6].map(SG).join('')}<div class="pce"><h3 class="ct">El autoconocimiento es un camino, no un destino.</h3><p class="ctx">Vuelve cuando quieras. Tus respuestas pueden cambiar con el tiempo, y eso también es información valiosa.</p><button class="br" id="b6">⟳ Hacer el test de nuevo</button></div></div>`}
function H(h){A.innerHTML=h;window.scrollTo({top:0,behavior:'smooth'})}
function U(){if(E.pasoActual===-2)H(RP());else if(E.pasoActual===-3)H(RM());else if(E.pasoActual===-1)H(RPF());else if(E.pasoActual>=0&&E.pasoActual<D.length)H(RQ());else{E.pasoActual=-2;H(RP())}B()}
function B(){const b1=document.getElementById('b1');if(b1)b1.addEventListener('click',()=>{E={respuestas:{},pasoActual:-3};L();G();U()});const b2=document.getElementById('b2');if(b2)b2.addEventListener('click',()=>{let f=D.findIndex((_,i)=>!DC(i));E.pasoActual=f===-1?-1:f;G();U()});const b3=document.getElementById('b3');if(b3)b3.addEventListener('click',()=>{E.pasoActual=0;G();U()});document.querySelectorAll('.op2').forEach(el=>{el.addEventListener('click',()=>{const sy=window.scrollY;const d=parseInt(el.dataset.d);const p=parseInt(el.dataset.p);const v=parseInt(el.dataset.v);S(d,p,v);document.querySelectorAll(`[data-d="${d}"][data-p="${p}"]`).forEach(o=>{o.classList.toggle('s',parseInt(o.dataset.v)===v)});const c=el.closest('.pr');if(c)c.classList.add('r');const bn=document.getElementById('b5');if(bn)bn.disabled=!DC(d);window.scrollTo({top:sy})})});const b5=document.getElementById('b5');if(b5)b5.addEventListener('click',()=>{E.pasoActual=E.pasoActual===D.length-1?-1:E.pasoActual+1;G();H(E.pasoActual===-1?RPF():RQ());B()});const b4=document.getElementById('b4');if(b4)b4.addEventListener('click',()=>{if(E.pasoActual>0){E.pasoActual--;G();H(RQ());B()}});const b6=document.getElementById('b6');if(b6)b6.addEventListener('click',()=>{E={respuestas:{},pasoActual:-2};L();G();U()})}
function I(){const h=C();if(!h){E={respuestas:{},pasoActual:-2}}else if(TC()){E.pasoActual=-1}else if(E.pasoActual<-3||E.pasoActual>=D.length){E.pasoActual=-2}G();U()}
I();
</script></body></html>
