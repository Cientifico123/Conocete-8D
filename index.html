function verArrastres(){
var df=getDF();
var ult7=[];
df.forEach(function(d){if(d.l===ultimoSorteo.l)ult7.push(d);});
ult7=ult7.slice(-7);

var nums1ra={};
ult7.forEach(function(d){nums1ra[d.n1]=true;});

var nums23={};
df.forEach(function(d){
if(!nums1ra[d.n2])nums23[d.n2]=(nums23[d.n2]||0)+1;
if(!nums1ra[d.n3])nums23[d.n3]=(nums23[d.n3]||0)+1;
});

var resultados=[];
Object.keys(nums23).forEach(function(n){
var num=parseInt(n);
var porHorario={};
var porLoteria={};

df.forEach(function(d){
if(d.n1===num && !(d.l===ultimoSorteo.l && d.h===ultimoSorteo.h)){
porHorario[d.h]=(porHorario[d.h]||0)+1;
porLoteria[d.l]=(porLoteria[d.l]||0)+1;
}
});

var mejorH='',maxH=0;
var mejorL='',maxL=0;
Object.keys(porHorario).forEach(function(h){if(porHorario[h]>maxH){maxH=porHorario[h];mejorH=h;}});
Object.keys(porLoteria).forEach(function(l){if(porLoteria[l]>maxL){maxL=porLoteria[l];mejorL=l;}});

if(maxH>0 && !(mejorL===ultimoSorteo.l && mejorH===ultimoSorteo.h)){
resultados.push({n:num,veces:nums23[n],horario:mejorH,loteria:mejorL,freq:maxL});
}
});

resultados.sort(function(a,b){return b.veces-a.veces;});

function verImpas(){
var df=getDF();
var transiciones=[];

for(var i=0;i<df.length-1;i++){
var actual=df[i];
var futuro=df.slice(i+1,i+10);

[actual.n2,actual.n3].forEach(function(num){
futuro.forEach(function(f,idx){
if(f.n1===num && !(f.l===ultimoSorteo.l && f.h===ultimoSorteo.h)){
transiciones.push({
n:num,
dias:idx+1,
aLot:f.l,
aHora:f.h
});
}
});
});
}

var stats={};
transiciones.forEach(function(t){
if(!stats[t.n]){
stats[t.n]={n:t.n,veces:0,totalDias:0,horarios:{},loterias:{}};
}
stats[t.n].veces++;
stats[t.n].totalDias+=t.dias;
stats[t.n].horarios[t.aHora]=(stats[t.n].horarios[t.aHora]||0)+1;
stats[t.n].loterias[t.aLot]=(stats[t.n].loterias[t.aLot]||0)+1;
});

var resultados=[];
Object.keys(stats).forEach(function(n){
var s=stats[n];
var promDias=Math.round(s.totalDias/s.veces*10)/10;

var mejorH='',maxH=0;
var mejorL='',maxL=0;
Object.keys(s.horarios).forEach(function(h){if(s.horarios[h]>maxH){maxH=s.horarios[h];mejorH=h;}});
Object.keys(s.loterias).forEach(function(l){if(s.loterias[l]>maxL){maxL=s.loterias[l];mejorL=l;}});

if(mejorH && !(mejorL===ultimoSorteo.l && mejorH===ultimoSorteo.h)){
resultados.push({
n:parseInt(n),
veces:s.veces,
promDias:promDias,
horario:mejorH,
loteria:mejorL,
freq:maxL
});
}
});

resultados.sort(function(a,b){return b.veces-b.veces;});

var html='<div class="view">';
html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">';
html+='<h2>⏰ IMPAS</h2>';

html+='<div style="font-size:0.85rem;color:#a0aec0;margin-top:5px">Después de ~'+r.promDias+' sorteos</div>';
html+='</div>';

}
html+='</div></div>';
document.getElementById('app').innerHTML=html;

r.push({t:t,total:total,horario:mejorH,loteria:mejorL,freq:maxL});

function getArrastresData(){
var df=getDF();
var ult7=[];
df.forEach(function(d){if(d.l===ultimoSorteo.l)ult7.push(d);});
ult7=ult7.slice(-7);

var nums1ra={};
ult7.forEach(function(d){nums1ra[d.n1]=true;});

var nums23={};
df.forEach(function(d){
if(!nums1ra[d.n2])nums23[d.n2]=(nums23[d.n2]||0)+1;
if(!nums1ra[d.n3])nums23[d.n3]=(nums23[d.n3]||0)+1;
});

var resultados=[];
Object.keys(nums23).forEach(function(n){
var num=parseInt(n);
var porLoteria={};
var porHorario={};
df.forEach(function(d){
if(d.n1===num && !(d.l===ultimoSorteo.l && d.h===ultimoSorteo.h)){
porLoteria[d.l]=(porLoteria[d.l]||0)+1;
porHorario[d.h]=(porHorario[d.h]||0)+1;
}
});
var mejorL='',maxL=0;
var mejorH='',maxH=0;
Object.keys(porLoteria).forEach(function(l){if(porLoteria[l]>maxL){maxL=porLoteria[l];mejorL=l;}});
Object.keys(porHorario).forEach(function(h){if(porHorario[h]>maxH){maxH=porHorario[h];mejorH=h;}});
if(maxL>0)resultados.push({n:num,veces:nums23[n],loteria:mejorL,horario:mejorH});
});

resultados.sort(function(a,b){return b.veces-a.veces;});
return resultados.slice(0,5);
}

function getImpasData(){
var df=getDF();
var transiciones=[];

for(var i=0;i<df.length-1;i++){
var actual=df[i];
var futuro=df.slice(i+1,i+10);
[actual.n2,actual.n3].forEach(function(num){
futuro.forEach(function(f,idx){
if(f.n1===num && !(f.l===ultimoSorteo.l && f.h===ultimoSorteo.h))transiciones.push({n:num,dias:idx+1,aLot:f.l,aHora:f.h});
});
});
}

var stats={};
transiciones.forEach(function(t){
if(!stats[t.n])stats[t.n]={n:t.n,veces:0,horarios:{},loterias:{}};
stats[t.n].veces++;
stats[t.n].horarios[t.aHora]=(stats[t.n].horarios[t.aHora]||0)+1;
stats[t.n].loterias[t.aLot]=(stats[t.n].loterias[t.aLot]||0)+1;
});

var resultados=[];
Object.keys(stats).forEach(function(n){
var s=stats[n];
var mejorH='',maxH=0;
var mejorL='',maxL=0;
Object.keys(s.horarios).forEach(function(h){if(s.horarios[h]>maxH){maxH=s.horarios[h];mejorH=h;}});
Object.keys(s.loterias).forEach(function(l){if(s.loterias[l]>maxL){maxL=s.loterias[l];mejorL=l;}});
resultados.push({n:parseInt(n),veces:s.veces,horario:mejorH,loteria:mejorL});
});

resultados.sort(function(a,b){return b.veces-a.veces;});
return resultados.slice(0,5);
}

function borrarUltimo(){
if(LOCALES.length===0){
alert('No hay sorteos locales para borrar');
return;
}
if(confirm('¿Borrar el último sorteo guardado?')){
LOCALES.pop();
HISTORIAL.pop();
if(HISTORIAL.length>0){
var ult=HISTORIAL[HISTORIAL.length-1];
ultimoSorteo={l:ult.l,h:ult.h,f:ult.f};
}
alert('✅ Último sorteo borrado\n📊 Total: '+HISTORIAL.length+' sorteos');
menu();
}
}

function guardar(){
var f=document.getElementById('f').value;
var l=document.getElementById('l').value;
var h=document.getElementById('h').value;
var n1=parseInt(document.getElementById('n1').value);
var n2=parseInt(document.getElementById('n2').value);
var n3=parseInt(document.getElementById('n3').value);

if(!f||isNaN(n1)){alert('Completa todos');return;}
if(n1<0||n1>99||n2<0||n2>99||n3<0||n3>99){alert('Números 0-99');return;}
if(n1===n2||n1===n3||n2===n3){alert('No repetir');return;}

LOCALES.push({f:f,l:l,h:h,n1:n1,n2:n2,n3:n3});
HISTORIAL.push({f:f,l:l,h:h,n1:n1,n2:n2,n3:n3});
ultimoSorteo={l:l,h:h,f:f};

alert('✅ Guardado\n📊 Total: '+HISTORIAL.length+' sorteos\n🔄 Ventanas recalculadas');
menu();
}
